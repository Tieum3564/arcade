# Included in the nginx "http" context (conf.d/*.conf).

# --- Abuse protection (per client IP) ---------------------------------------
# If the server sits behind another reverse proxy / CDN, configure set_real_ip_from
# + real_ip_header so that $binary_remote_addr is the real visitor IP.
limit_req_zone  $binary_remote_addr zone=arcade_read:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=arcade_write:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=arcade_conn:10m;

# Pages and scripts must always be revalidated after an update
map $uri $arcade_cache_control {
    ~*\.(html|js|css)$  "no-cache";
    default         "";
}

server_tokens off;

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size  4k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    limit_conn arcade_conn 20;

    # --- Security headers (defined only here: a location with its own add_header would drop them)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $arcade_cache_control;
    # Enable only once the site is served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hidden files (.git, .env, ...)
    location ~ /\. {
        return 404;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    # Write endpoints: strict rate limit
    location ~ ^/api/(login|scores)$ {
        limit_except POST { deny all; }
        limit_req zone=arcade_write burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/arcade-proxy.inc;
    }

    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=arcade_read burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/arcade-proxy.inc;
    }
}
