services:
  web:
    # Non-root Nginx variant (listens on 8080 inside the container)
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks: [frontend, backend]
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - arcade-data:/data
    # Only reachable through Nginx; no Internet access
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  arcade-data:
