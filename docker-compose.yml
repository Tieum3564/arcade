services:
  web:
    # Non-root Nginx variant (listens on 8080 inside the container)
    image: nginxinc/nginx-unprivileged:1.27-alpine
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=elima"
      - "traefik.http.routers.arcade.rule=Host(`arcade.elima.ovh`)"
      - "traefik.http.routers.arcade.entrypoints=websecure"
      - "traefik.http.routers.arcade.tls=true"
      - "traefik.http.routers.arcade.tls.certresolver=letsencrypt"
      - "traefik.http.services.arcade.loadbalancer.server.port=8080"
    volumes:
      - /home/debian/game/arcade/public:/usr/share/nginx/html:ro
      - /home/debian/game/arcade/nginx:/etc/nginx/conf.d:ro
    networks: [elima, backend]
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    restart: unless-stopped

  api:
    build: /home/debian/game/arcade/api
    volumes:
      - arcade-data:/data
    # Only reachable through Nginx; no Internet access
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    restart: unless-stopped

networks:
  elima:
    external: true
  backend:
    internal: true

volumes:
  arcade-data:
